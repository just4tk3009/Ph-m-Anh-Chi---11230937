# =============================================================================
# BFT65B - FDIC Early-Warning Pipeline: central configuration
# Every script reads this file, so the whole pipeline is reproducible from it.
# Paths are relative to the repository root unless absolute.
# =============================================================================

paths:
  data_dir: data            # bronze/ silver/ gold/ live under this folder
  reports_dir: reports      # tables/ figures/ for the report

api:
  base_url: https://api.fdic.gov/banks
  page_limit: 10000          # FDIC API maximum page size
  timeout_s: 90
  max_retries: 6             # HTTP retries on 429/5xx/connection errors
  backoff_factor: 2.0        # sleep = backoff_factor * 2**(retry-1) seconds
  sleep_between_requests_s: 0.25   # politeness delay between pages

ingestion:
  start_quarter: 1984Q1          # exam scope: all banks 1984Q1 -> 2026Q2 (~1.68M rows)
  end_quarter: 2026Q2
  # Call Report variables (FDIC BankFind "financials" endpoint).
  # Amounts are in THOUSANDS of USD. Income items (NETINC, INTINC, EINTEXP,
  # NONII, NONIX, ELNATR, NTLNLS) are YEAR-TO-DATE cumulative values.
  # Run `python pipeline.py probe` first: it lists which of these fields the
  # API actually returns and warns about any that are unknown.
  financial_fields:
    - CERT       # FDIC certificate number (bank id)
    - REPDTE     # report date (quarter end, YYYYMMDD)
    - STNAME     # state name (point-in-time location of the bank)
    - ASSET      # total assets
    - DEP        # total deposits
    - DEPDOM     # domestic deposits
    - EQ         # total equity capital
    - LNLSGR     # gross loans and leases
    - LNLSNET    # net loans and leases
    - LNATRES    # allowance for loan and lease losses
    - LNRE       # real-estate loans
    - LNCI       # commercial and industrial loans
    - LNCON      # consumer loans
    - NCLNLS     # noncurrent loans and leases (90+ days past due + nonaccrual)
    - P3ASSET    # assets 30-89 days past due
    - P9ASSET    # assets 90+ days past due
    - NAASSET    # nonaccrual assets
    - ORE        # other real estate owned (foreclosed assets)
    - NTLNLS     # net charge-offs (YTD)
    - ELNATR     # provision for loan and lease losses (YTD)
    - NETINC     # net income (YTD)
    - INTINC     # total interest income (YTD)
    - EINTEXP    # total interest expense (YTD)
    - NONII      # total noninterest income (YTD)
    - NONIX      # total noninterest expense (YTD)
    - SC         # total securities
    - CHBAL      # cash and balances due from depository institutions
    - BRO        # brokered deposits
    - RBC1AAJ    # leverage (core capital) ratio, %
    - RBCRWAJ    # total risk-based capital ratio, %
    - ROA        # return on assets, % (FDIC computed)
    - ROE        # return on equity, % (FDIC computed)
    - NIMY       # net interest margin, % (FDIC computed)
  institution_fields:
    - CERT
    - NAME
    - CITY
    - STALP      # state abbreviation
    - STNAME     # state name
    - BKCLASS    # charter class
    - REGAGNT    # primary regulator
    - ESTYMD     # establishment date
    - ACTIVE     # LEAKY: 0/1 status as of download date (future information)
    - ENDEFYMD   # LEAKY: end date of the institution (future information)
    - CHANGEC1   # LEAKY: code of the structural change that ended reporting (merger, ...)
    - INSDATE    # date of deposit insurance
  failure_fields:
    - CERT
    - NAME
    - CITYST
    - FAILDATE
    - FAILYR
    - RESTYPE
    - RESTYPE1
    - SAVR
    - QBFASSET
    - QBFDEP
    - COST

gold:
  label_horizon_quarters: 4     # target = bank fails within the next 4 quarters
  publication_lag_days: 60      # report is publicly usable ~60 days after REPDTE
  gold_format: delta            # delta | parquet

split:                          # temporal split, all dates inclusive (exam section 2.3)
  # DEVELOPMENT = train + valid = 1984Q1-2007Q4 (S&L / early-1990s crisis).
  # GAP 2008Q1-2008Q4 (>= 4 quarters, required). TEST = 2009Q1-2025Q2 (GFC + 2023),
  # which holds far more than the required 50 failures. Modelling stops at 2025Q2
  # because later labels are incomplete. Tuning / selection / threshold use DEV only.
  train_start: 1984-03-31
  train_end: 1992-12-31         # inner fitting window inside development
  valid_end: 2007-12-31         # validation window 1993-2007 (end of development)
  test_start: 2009-03-31        # first test quarter (gap after valid_end >= 4 quarters)
  test_end: 2025-06-30          # last quarter with a complete 4-quarter label
  purge_horizon: true           # drop rows whose label window crosses a boundary

quality:
  iqr_k: 3.0                    # Tukey far-out fences (k=3) for heavy tails
  near_constant_share: 0.995    # drop if the mode covers >= 99.5% of train rows
  lof_neighbors: 35
  lof_contamination: 0.01
  lof_max_train_rows: 60000     # LOF is O(n^2)-ish; sample the train window
  random_state: 42

benchmark:
  repeats: 5                    # repeated runs per measurement (median reported)
  scale_factors: [1, 4]         # x1 = real data; x4 = real rows replicated (labelled as such)

processing_benchmark:           # Module 3: same workload in four engines
  engines: [pandas, polars_eager, polars_lazy, pyspark]   # pyspark is skipped if not installed
  scale_factors: [1, 4]
  repeats: 3
  spark_driver_memory: 4g
  spark_shuffle_partitions: 8   # Spark default 200 is tuned for clusters, not one laptop

selection:                      # Module 4 funnel (all fitted on the train window)
  f_test_alpha: 0.001
  max_abs_spearman: 0.85        # collinearity threshold for pruning
  inner_fold_years: [1987, 1988, 1989, 1990, 1991]   # expanding windows: train <= Y, validate Y+1
  l1_C_grid: [0.0001, 0.0003, 0.001, 0.01, 0.1, 1.0]  # 0.001 was the edge of the first grid
  min_fold_share: 0.5           # stability selection: kept if selected in >= 50% of folds
  neg_sample_rate: 0.25         # speed: all positives + 25% of negatives for model fits
  mi_neg_sample_rate: 0.10      # mutual information is O(n log n) per feature
  perm_repeats: 5
  min_features: 5

freedman:                       # Module 4 simulation on pure noise
  grid: [[50, 200], [200, 200], [1000, 200]]
  k: 10
  reps: 200
