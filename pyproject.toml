[project]
name = "fdic-ews"
version = "0.1.0"
description = "BFT65B: Big-Data pipeline for an FDIC bank-failure early-warning system"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
